        if (!addCandidateForm.reportValidity()) {
          return;
        }

        saveCandidateButton.disabled = true;

        const isEdit = editSourcedRowIndex.value !== "";

        saveCandidateButton.textContent = isEdit ? "Updating..." : "Saving...";

        formMessage.className = "form-message";

        formMessage.textContent = "";

        try {
          const formData = new FormData(addCandidateForm);

          const candidate = {};

          formData.forEach((value, key) => {
            if (key !== "rowIndex" && key !== "processedRowIndex") {
              candidate[key] = String(value).trim();
            }
          });

          const action = isEdit ? "editSourced" : "addSourced";

          if (isEdit) {
            const sheetRow = parseInt(editSourcedRowIndex.value, 10);

            if (Number.isNaN(sheetRow) || sheetRow < 2) {
              throw new Error("Invalid sourced sheet row.");
            }

            candidate.__sheetRow = sheetRow;
          }

          const response = await fetch(SOURCED_API_URL, {
            method: "POST",

            headers: {
              "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
            },

            body: new URLSearchParams({
              action: action,
              data: JSON.stringify(candidate),
            }),
          });

          const result = await response.json();

          if (!result.success) {
            throw new Error(
              result.error || "Unable to save sourced candidate.",
            );
          }

          formMessage.className = "form-message show success-message";

          formMessage.textContent = isEdit
            ? "Candidate updated successfully."
            : "Candidate added successfully.";

          await loadSourced();
          applyFilters();

          setTimeout(() => {
            closeAddCandidate();
          }, 700);
        } catch (err) {
          console.error("Sourced candidate save error:", err);

          formMessage.className = "form-message show error-message";

          formMessage.textContent = err.message || "Unable to save candidate.";
        } finally {
          saveCandidateButton.disabled = false;

          saveCandidateButton.textContent = isEdit
            ? "Update Candidate"
            : "Save Candidate";
        }
      }

      /* =========================================================
        EDIT SOURCED CANDIDATE
    ========================================================== */

function openEditSourcedModal() {
        if (!currentSelectedCandidate) {
          return;
        }

        closeCandidateModal();

        addCandidateForm.reset();

        formMessage.className = "form-message";

        formMessage.textContent = "";

        const sheetRow = Number(currentSelectedCandidate.__sheetRow);

        if (!Number.isInteger(sheetRow) || sheetRow < 2) {
          formMessage.className = "form-message show error-message";

          formMessage.textContent =
            "Unable to identify the Google Sheet row for this candidate.";

          return;
        }

        editSourcedRowIndex.value = String(sheetRow);

        editProcessedRowIndex.value = "";

        const elements = addCandidateForm.elements;

        for (const el of elements) {
          if (
            el.name &&
            el.name !== "rowIndex" &&
            el.name !== "processedRowIndex"
          ) {
            el.value = getField(currentSelectedCandidate, el.name);
          }
        }

        document.getElementById("addCandidateModalTitle").textContent =
          "Edit Sourced Candidate";

        document.getElementById("addCandidateModalSubtitle").textContent =
          "Update candidate details";

        saveCandidateButton.textContent = "Update Candidate";

        addCandidateModal.classList.add("show");

        document.body.style.overflow = "hidden";
      }

      /* =========================================================
        INTERVIEW MODAL
    ========================================================== */

function createMatrixRain() {
        const container = document.getElementById("matrixRainContainer");
        const characters =
          "0101010101XYZ_SYS_ACCESS_GRANTED_SECURE_ATS_HEX_NULL_0x";
        const dropCount = 15; // Reduced from 45 to eliminate lag

        for (let i = 0; i < dropCount; i++) {
          const drop = document.createElement("div");
          drop.className = "matrix-drop";

          let text = "";
          const length = Math.floor(Math.random() * 8) + 6;
          for (let j = 0; j < length; j++) {
            text +=
              characters.charAt(Math.floor(Math.random() * characters.length)) +
              " ";
          }
          drop.innerHTML = text;
          
          const duration = Math.random() * 6 + 6;
          const delay = Math.random() * 5;
          drop.style.animationDuration = `${duration}s`;
          drop.style.animationDelay = `${delay}s`;

          container.appendChild(drop);
        }
      }

      /* =========================================================
        INITIAL LOAD
    ========================================================== */

      createMatrixRain();
      loadAllData();
    


      /* =========================================================
         PROFESSIONAL MOTION HOOKS
         Decorative only. No API/data/application logic changed.
      ========================================================== */
      (() => {
        const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)");

        // One-shot tactile click signal. No timers, no layout reads.
        document.addEventListener("click", (event) => {
          if (prefersReduced.matches) return;
          const el = event.target.closest?.(
            "button,.module-tab,.page-btn,.candidate-card,.resume-badge,.interview-status-badge"
          );
          if (!el || el.disabled) return;

          el.classList.remove("cyber-click");
          void el.offsetWidth;
          el.classList.add("cyber-click");
          window.setTimeout(() => el.classList.remove("cyber-click"), 180);
        }, { passive: true });

        // Re-apply the entrance animation when the existing app refreshes/rebuilds cards.
        const grid = document.querySelector(".cards-container");
        if (grid) {
          const refreshCardMotion = () => {
            grid.querySelectorAll(".candidate-card").forEach((card, index) => {
              card.style.setProperty(
                "--cyber-card-delay",
                `${Math.min(index, 10) * 35}ms`
              );
            });
          };
          const observer = new MutationObserver(refreshCardMotion);
          observer.observe(grid, { childList: true });
          refreshCardMotion();
        }
      })();



      /* =========================================================
         TRACKERS MODULE — CLIENT-ONLY DATA ENTRY
         Reads tracker sheet names + headers from Apps Script.
         No tracker values are ever POSTed or saved.
      ========================================================== */
      const TRACKERS_API_URL = "https://script.google.com/macros/s/AKfycby4CxZ4HSGYKzRU9JlDFZ4k4G4M1UfMtvnO1KoizqL3I9EOlbmCJAxQx5xEcoeRg4Br/exec";
      const trackersTab = document.getElementById("trackersTab");
      const trackersWorkspace = document.getElementById("trackersWorkspace");
      const trackerFormatSelect = document.getElementById("trackerFormatSelect");
      const trackerRefreshFormats = document.getElementById("trackerRefreshFormats");
      const trackerAddRow = document.getElementById("trackerAddRow");
      const trackerCopyExcel = document.getElementById("trackerCopyExcel");
      const trackerClearRows = document.getElementById("trackerClearRows");
      const trackerIncludeHeaders = document.getElementById("trackerIncludeHeaders");
      const trackerRows = document.getElementById("trackerRows");
      const trackerEmptyState = document.getElementById("trackerEmptyState");
      const trackerFormatInfo = document.getElementById("trackerFormatInfo");
      const trackerStatus = document.getElementById("trackerStatus");
      const trackerPreviewWrap = document.getElementById("trackerPreviewWrap");
      const trackerPreview = document.getElementById("trackerPreview");

      let trackerFormats = [];
      let trackerHeaders = [];
      let trackerRowCount = 0;


function initializeModule() {
  const addButton = document.getElementById("moduleActionButton");

  if (closeModal) closeModal.addEventListener("click", closeCandidateModal);
  if (modalCloseButton) modalCloseButton.addEventListener("click", closeCandidateModal);
  if (candidateModal) candidateModal.addEventListener("click", (event) => {
    if (event.target === candidateModal) closeCandidateModal();
  });
  if (modalEditButton) modalEditButton.addEventListener("click", () => {
    openEditSourcedModal();
  });

  if (searchInput) searchInput.addEventListener("input", applyFilters);
  if (locationFilter) locationFilter.addEventListener("change", applyFilters);
  if (positionFilter) positionFilter.addEventListener("change", applyFilters);
  if (experienceFilter) experienceFilter.addEventListener("change", applyFilters);
  if (flagFilter) flagFilter.addEventListener("change", applyFilters);

  if (refreshButton) refreshButton.addEventListener("click", async () => {
    refreshButton.disabled = true;
    refreshButton.textContent = "Refreshing...";
    try { await loadAllData(true); }
    finally {
      refreshButton.disabled = false;
      refreshButton.textContent = "↻ Refresh";
    }
  });

  if (addButton) addButton.addEventListener("click", () => {
    openAddCandidateModal();
  });

  if (closeAddCandidateModal) closeAddCandidateModal.addEventListener('click', closeAddCandidate); if (cancelAddCandidate) cancelAddCandidate.addEventListener('click', closeAddCandidate); if (addCandidateModal) addCandidateModal.addEventListener('click', (event) => {{ if (event.target === addCandidateModal) closeAddCandidate(); }}); if (addCandidateForm) addCandidateForm.addEventListener('submit', saveSourcedCandidate);
  
  
  

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeCandidateModal();
      closeAddCandidate();
      
      
    }
  });

  createMatrixRain();
  loadAllData(false);

  const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  document.addEventListener("click", (event) => {
    if (prefersReduced.matches) return;
    const el = event.target.closest?.("button,.page-btn,.candidate-card,.resume-badge,.interview-status-badge");
    if (!el || el.disabled) return;
    el.classList.remove("cyber-click");
    void el.offsetWidth;
    el.classList.add("cyber-click");
    window.setTimeout(() => el.classList.remove("cyber-click"), 180);
  }, { passive:true });

  const grid = document.querySelector(".cards-container");
  if (grid) {
    const observer = new MutationObserver(() => {
      grid.querySelectorAll(".candidate-card").forEach((card,index) => {
        card.style.setProperty("--cyber-card-delay", `${Math.min(index,10)*35}ms`);
      });
    });
    observer.observe(grid, {childList:true});
  }
}
initializeModule();
