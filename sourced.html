<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recruiter ATS // Sourced</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
      /* =========================================================
         ROOT - ULTRA-MODERN CYBER-OPS THEME
         (BLACK / NEON GREEN / DATA BLUE / LASER RED)
      ========================================================== */
      :root {
        /* Core Colors */
        --bg-deep: #030507;
        --bg-panel: rgba(5, 12, 18, 0.7);
        --bg-card: rgba(8, 16, 24, 0.85);
        
        --primary: #00ff66; /* Neon Emerald */
        --primary-glow: rgba(0, 255, 102, 0.4);
        --primary-dim: rgba(0, 255, 102, 0.1);

        --secondary: #00e5ff; /* Data Blue */
        --secondary-glow: rgba(0, 229, 255, 0.4);
        --secondary-dim: rgba(0, 229, 255, 0.1);

        --danger: #ff003c; /* Laser Red */
        --danger-glow: rgba(255, 0, 60, 0.5);
        --danger-dim: rgba(255, 0, 60, 0.15);

        --text-main: #e0fff0;
        --text-muted: #5b8c7a;
        --text-bright: #ffffff;

        --border: rgba(0, 229, 255, 0.3);
        --border-focus: #00e5ff;

        --clip-angle: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
      }

      /* THREAT OVERRIDE (< 6 Years) */
      .low-experience {
        --primary: var(--danger) !important;
        --primary-glow: var(--danger-glow) !important;
        --primary-dim: var(--danger-dim) !important;
        --secondary: #ff3366 !important;
        --secondary-glow: rgba(255, 51, 102, 0.4) !important;
        --border: rgba(255, 0, 60, 0.5) !important;
        --text-main: #ffd6df !important;
        --text-muted: #a35c6a !important;
        animation: threatPulse 3s ease-in-out infinite alternate !important;
      }

      /* =========================================================
         STATE-OF-THE-ART ANIMATIONS (Optimized for performance)
      ========================================================== */
      
      /* 1. Holographic System Boot */
      @keyframes sysBoot {
        0% { opacity: 0; transform: scale(0.98); }
        100% { opacity: 1; transform: scale(1); }
      }

      /* 2. Tactical Grid Pan */
      @keyframes gridPan {
        0% { background-position: 0 0; }
        100% { background-position: 80px 80px; }
      }

      /* 3. Sweeping LiDAR Radar */
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* 4. Text Decryption */
      @keyframes decryptText {
        0% { opacity: 0; transform: translateY(3px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* 5. Laser Scanline (Hover on cards) */
      @keyframes laserScan {
        0% { top: -20%; opacity: 0; }
        50% { opacity: 0.8; }
        100% { top: 120%; opacity: 0; }
      }

      /* 6. Glowing Circuit Border Flow */
      @keyframes circuitFlow {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }

      /* 7. Avatar HUD Rings */
      @keyframes hudSpin { 100% { transform: rotate(360deg); } }
      @keyframes hudSpinReverse { 100% { transform: rotate(-360deg); } }

      /* 8. Chromatic Aberration Glitch (Buttons) */
      @keyframes chromaticGlitch {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-1px, 1px); }
        40% { transform: translate(1px, -1px); }
        60% { transform: translate(0); }
      }

      /* 9. Threat Hazard Stripes */
      @keyframes hazardPan { 100% { background-position: 40px 40px; } }

      /* 10. Threat Core Pulse */
      @keyframes threatPulse {
        0% { box-shadow: 0 0 10px var(--danger-dim); }
        100% { box-shadow: 0 0 25px var(--danger-glow); }
      }

      /* 11. Modal Vault Opening */
      @keyframes vaultDeploy {
        0% { transform: scale(0.95); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* 12. Floating Telemetry Data (Optimized via GPU composition) */
      @keyframes telemetryStream {
        0% { transform: translate3d(-100vw, 0, 0); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translate3d(100vw, 0, 0); opacity: 0; }
      }

      /* 13. Data Stream Vertical Lines */
      @keyframes vStream {
        0% { transform: translateY(-100%); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: translateY(800%); opacity: 0; }
      }

      /* =========================================================
         GLOBAL ENVIRONMENT
      ========================================================== */
      ::selection { background: var(--primary); color: #000; }
      
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; }

      body {
        font-family: "Rajdhani", sans-serif;
        color: var(--text-main);
        background-color: var(--bg-deep);
        overflow: hidden;
        position: relative;
      }

      /* Layer 1: Tactical Grid */
      body::before {
        content: "";
        position: absolute;
        inset: -50%;
        background-image: 
          linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
        background-size: 40px 40px;
        animation: gridPan 20s linear infinite;
        z-index: -3;
        will-change: background-position;
      }

      /* Layer 2: LiDAR Sweeper (GPU accelerated) */
      body::after {
        content: "";
        position: absolute;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0, 255, 102, 0.015) 60deg, transparent 90deg);
        animation: radarSweep 25s linear infinite;
        z-index: -2;
        pointer-events: none;
        will-change: transform;
      }

      /* =========================================================
         HIJACKED MATRIX RAIN -> TELEMETRY STREAMS
      ========================================================== */
      .matrix-rain {
        position: absolute; inset: 0; pointer-events: none; z-index: -1; overflow: hidden;
      }
      .matrix-drop {
        position: absolute;
        color: var(--secondary);
        font-size: 11px;
        white-space: nowrap;
        opacity: 0;
        text-shadow: 0 0 5px var(--secondary-glow);
        top: auto !important;
        left: 0 !important;
        animation-name: telemetryStream !important;
        animation-timing-function: linear !important;
        will-change: transform, opacity;
      }
      .matrix-drop:nth-child(2n) { top: 20% !important; color: var(--primary); }
      .matrix-drop:nth-child(3n) { top: 40% !important; }
      .matrix-drop:nth-child(4n) { top: 60% !important; font-size: 13px; }
      .matrix-drop:nth-child(5n) { top: 80% !important; color: var(--text-bright); }

      /* =========================================================
         HEADER - SECURE UPLINK
      ========================================================== */
      .header {
        height: 70px;
        background: rgba(2, 6, 10, 0.9);
        backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--primary);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 40px;
        position: relative;
        z-index: 100;
        animation: sysBoot 0.6s ease-out forwards;
        box-shadow: 0 5px 20px rgba(0,0,0,0.6);
      }

      .header::after {
        content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px;
        background: linear-gradient(90deg, var(--secondary), var(--primary), var(--secondary));
        background-size: 200% 100%;
        animation: circuitFlow 6s linear infinite;
      }

      .logo {
        font-size: 26px;
        font-weight: 900;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 4px;
        text-shadow: 0 0 10px var(--primary-glow);
        display: flex; align-items: center; gap: 15px;
      }
      .logo::before {
        content: "SYS.CORE//"; color: var(--secondary); font-weight: 300; font-size: 15px; letter-spacing: 2px; text-shadow: none;
      }
      .logo:hover { animation: chromaticGlitch 0.2s ease; }

      .page-title {
        font-size: 13px; font-weight: 900; color: #000; background: var(--primary);
        padding: 8px 20px; text-transform: uppercase; letter-spacing: 2px;
        clip-path: var(--clip-angle);
        box-shadow: 0 0 15px var(--primary-glow);
      }

      /* =========================================================
         MAIN CONTAINER
      ========================================================== */
      .container {
        height: calc(100vh - 70px);
        padding: 25px 40px 30px;
        max-width: 1800px;
        margin: 0 auto;
        display: flex; flex-direction: column;
        overflow: hidden; position: relative; z-index: 10;
      }

      /* =========================================================
         HOLOGRAPHIC PANELS (STATS & TOOLBAR)
      ========================================================== */
      .stats-bar, .toolbar {
        flex-shrink: 0;
        background: var(--bg-panel);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        position: relative;
        animation: sysBoot 0.6s ease-out both;
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
      }
      
      .stats-bar::before, .toolbar::before {
        content: ''; position: absolute; top: 0; left: 20%; width: 1px; height: 15px;
        background: var(--secondary);
        animation: vStream 4s linear infinite;
      }

      .stats-bar {
        padding: 18px 30px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
        border-left: 4px solid var(--primary);
      }

      .stat-item { display: flex; align-items: center; gap: 15px; }
      .stat-item-label { color: var(--text-muted); font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 2px; }
      .stat-item-value { color: #fff; font-weight: 900; font-size: 24px; text-shadow: 0 0 10px var(--secondary-glow); }

      .stat-divider { width: 2px; height: 30px; background: linear-gradient(to bottom, transparent, var(--secondary), transparent); opacity: 0.3; }

      .toolbar {
        padding: 14px 25px; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;
        border-left: 4px solid var(--secondary);
      }

      .search-box { flex: 1 1 250px; min-width: 0; position: relative; }
      .search-box::before {
        content: "root@db:~#"; position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
        color: var(--primary); font-weight: 900; font-size: 12px;
      }

      .toolbar select { flex: 0 1 190px; width: 190px; min-width: 0; text-overflow: ellipsis; overflow: hidden; }
      .toolbar #flagFilter { flex: 0 1 150px; width: 150px; min-width: 0; }
      .refresh-btn { flex: 0 0 auto; white-space: nowrap; }

      .search-box input, select, button { font-family: "Rajdhani", sans-serif; letter-spacing: 1px; }

      .search-box input {
        width: 100%; min-width: 0; padding: 12px 20px 12px 105px;
        background: rgba(0, 0, 0, 0.7); border: 1px solid var(--border); border-bottom: 2px solid var(--primary);
        color: #fff; font-size: 14px; font-weight: bold; outline: none; transition: background 0.2s, border-color 0.2s;
      }
      .search-box input:focus {
        background: var(--secondary-dim); border-color: var(--primary);
      }

      select, button {
        padding: 12px 18px; background: rgba(0, 0, 0, 0.7); border: 1px solid var(--border);
        color: var(--secondary); font-size: 13px; font-weight: 900; text-transform: uppercase;
        cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s; position: relative;
      }

      select:hover, button:hover {
        background: var(--secondary-dim); border-color: var(--secondary); color: #fff;
        box-shadow: 0 0 15px var(--secondary-glow);
      }

      .refresh-btn {
        background: var(--primary-dim); border-color: var(--primary); color: #fff;
        clip-path: var(--clip-angle);
      }
      .refresh-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow); }

      /* =========================================================
         MODULE TABS
      ========================================================== */
      .module-tabs {
        flex-shrink: 0; display: flex; gap: 12px; margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .module-tab {
        min-width: 150px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border);
        color: var(--text-muted); clip-path: var(--clip-angle); transition: 0.2s;
      }
      .module-tab.active {
        background: var(--secondary); color: #000; border-color: var(--secondary);
        box-shadow: 0 0 20px var(--secondary-glow); font-weight: 900;
      }

      /* Action Buttons */
      .add-candidate-btn, .processed-btn, .interview-schedule-btn {
        margin-left: auto; background: rgba(0,0,0,0.8); border: 1px solid var(--primary);
        color: var(--primary); clip-path: var(--clip-angle);
      }
      .add-candidate-btn { display: none; }
      .add-candidate-btn.show { display: inline-flex; align-items: center; gap: 10px; }
      
      .processed-btn { border-color: var(--secondary); color: var(--secondary); }
      .interview-schedule-btn { border-color: #ffb700; color: #ffb700; }
      
      .add-candidate-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary-glow); }
      .processed-btn:hover { background: var(--secondary); color: #000; box-shadow: 0 0 20px var(--secondary-glow); }
      .interview-schedule-btn:hover { background: #ffb700; color: #000; box-shadow: 0 0 20px rgba(255,183,0,0.4); }

      .interview-filter-hidden { display: none !important; }
      .interview-status-badge {
        font-size: 11px; font-weight: 900; padding: 5px 10px; background: rgba(255, 183, 0, 0.1);
        color: #ffb700; border: 1px solid #ffb700; letter-spacing: 1px;
      }

      /* =========================================================
         SCROLL AREA
      ========================================================== */
      .applications-scroll {
        flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
        padding-right: 10px; padding-bottom: 40px;
      }
      .applications-scroll::-webkit-scrollbar { width: 6px; }
      .applications-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); border-left: 1px solid var(--border); }
      .applications-scroll::-webkit-scrollbar-thumb { background: var(--secondary); }
      
      /* =========================================================
         CYBER-CARDS (Optimized for zero-lag rendering)
      ========================================================== */
      .cards-container {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        padding-top: 10px;
        padding-bottom: 10px;
        width: 100%;
      }

      .candidate-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        padding: 18px; cursor: pointer; position: relative;
        clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        animation: sysBoot 0.4s ease-out both;
        backdrop-filter: blur(10px);
      }

      /* Glowing Animated Border Underlay */
      .candidate-card::before {
        content: ''; position: absolute; inset: -1px; z-index: -1;
        background: linear-gradient(90deg, var(--secondary-glow), transparent, var(--primary-glow), transparent);
        background-size: 200% 100%;
        opacity: 0; transition: opacity 0.2s ease;
      }

      /* Horizontal Laser Sweep */
      .candidate-card::after {
        content: ''; position: absolute; left: 0; width: 100%; height: 2px;
        background: var(--secondary); box-shadow: 0 0 10px var(--secondary);
        opacity: 0; pointer-events: none; z-index: 10;
      }

      .candidate-card:hover {
        border-color: var(--secondary);
        box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        transform: translateY(-4px);
      }
      .candidate-card:hover::before { opacity: 1; animation: circuitFlow 3s linear infinite; }
      .candidate-card:hover::after { animation: laserScan 1.5s ease-in-out infinite; }

      /* --- THREAT SYSTEM: Low Experience (<6 Years) --- */
      .candidate-card.low-experience {
        background: repeating-linear-gradient(
          -45deg,
          rgba(255, 0, 60, 0.03),
          rgba(255, 0, 60, 0.03) 10px,
          rgba(8, 16, 24, 0.95) 10px,
          rgba(8, 16, 24, 0.95) 20px
        );
        animation: threatPulse 2s ease-in-out infinite alternate !important;
      }
      .candidate-card.low-experience:hover {
        box-shadow: 0 10px 30px rgba(255,0,60,0.3);
      }
      .candidate-card.low-experience::after { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
      .candidate-card.low-experience::before { background: linear-gradient(90deg, var(--danger-glow), transparent); }

      .card-top {
        display: flex; align-items: center; gap: 18px; margin-bottom: 20px;
        border-bottom: 1px solid var(--border); padding-bottom: 16px; position: relative;
      }

      /* Complex HUD Avatar */
      .candidate-avatar, .modal-avatar {
        width: 56px; height: 56px; background: rgba(0,0,0,0.9);
        border: 2px solid var(--primary); color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 20px; flex-shrink: 0; position: relative;
        text-shadow: 0 0 10px var(--primary-glow);
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      }
      
      .candidate-avatar::before, .modal-avatar::before {
        content: ''; position: absolute; inset: -4px;
        border: 2px dashed var(--secondary); border-radius: 50%;
        animation: hudSpin 8s linear infinite; z-index: -1;
      }

      .candidate-main { min-width: 0; z-index: 2; }
      .candidate-name {
        font-size: 20px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px var(--secondary-glow);
      }
      .candidate-position {
        font-size: 11px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px;
      }

      .card-info {
        display: grid; grid-template-columns: 1fr 1fr; gap: 12px 15px; margin-bottom: 20px;
        background: rgba(0, 0, 0, 0.5); padding: 15px; border: 1px solid var(--border);
        border-left: 4px solid var(--secondary); position: relative; z-index: 2;
      }

      .info-label, .detail-label {
        font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px; font-weight: 800;
      }
      .info-value {
        font-size: 14px; font-weight: 900; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .card-footer {
        display: flex; align-items: center; justify-content: space-between; padding-top: 15px;
        border-top: 1px dashed var(--border); position: relative; z-index: 2;
      }

      .timestamp { font-size: 10px; color: var(--text-muted); letter-spacing: 1.5px; font-weight: 900; }

      .resume-badge, .no-resume {
        font-size: 10px; font-weight: 900; padding: 6px 12px; text-transform: uppercase; letter-spacing: 1.5px; clip-path: var(--clip-angle);
      }
      .resume-badge { background: var(--secondary-dim); color: #fff; border: 1px solid var(--secondary); }
      .no-resume { background: var(--danger-dim); color: var(--danger); border: 1px dashed var(--danger); }

      /* =========================================================
         APPLICATION FLAGS
      ========================================================= */
      .application-flag-wrap { display: flex; align-items: center; gap: 8px; }
      .application-flag-label { font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); }
      .application-flag-select {
        min-width: 120px; padding: 6px 12px; border: 1px solid var(--border); background: #000;
        color: var(--secondary); font-size: 11px; font-weight: 900; text-transform: uppercase; clip-path: var(--clip-angle);
      }
      .application-flag-select.flag-original { border-color: var(--primary); color: #000; background: var(--primary); }
      .application-flag-select.flag-duplicate { border-color: var(--danger); color: #000; background: var(--danger); }
      .application-flag-select.saving { opacity: 0.5; pointer-events: none; }

      /* =========================================================
         SOURCED / PROCESSED STAGE DROPDOWNS
      ========================================================== */
      .stage-flags-wrap { display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
      .stage-flag-group { display:flex; align-items:center; gap:5px; }
      .stage-flag-label { font-size:8px; font-weight:900; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); white-space:nowrap; }
      .stage-flag-select { min-width:92px; padding:4px 7px; border:1px solid var(--border); background:#000; color:var(--secondary); font-size:9px; font-weight:900; text-transform:uppercase; clip-path:var(--clip-angle); }
      .stage-flag-select.flag-original { border-color:var(--primary); color:#000; background:var(--primary); }
      .stage-flag-select.flag-duplicate { border-color:var(--danger); color:#000; background:var(--danger); }
      .stage-flag-select.status-processed { border-color:var(--secondary); color:#000; background:var(--secondary); }
      .stage-flag-select.status-not-processed { border-color:#ffb700; color:#000; background:#ffb700; }
      .stage-flag-select.status-scheduled { border-color:var(--primary); color:#000; background:var(--primary); }
      .stage-flag-select.status-not-scheduled { border-color:var(--danger); color:#000; background:var(--danger); }
      .stage-flag-select.saving { opacity:.5; pointer-events:none; }
      @media (max-width:900px){ .stage-flags-wrap{ width:100%; justify-content:space-between; } }

      /* =========================================================
         PAGINATION
      ========================================================= */
      .pagination {
        display: flex; justify-content: space-between; align-items: center;
        padding: 25px 0; border-top: 1px solid var(--border); margin-top: 20px;
      }
      .pagination-info { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }
      .pagination-buttons { display: flex; gap: 8px; }
      .page-btn {
        min-width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.8); font-weight: 900; font-size: 15px; color: var(--secondary);
        border: 1px solid var(--border); clip-path: var(--clip-angle); transition: 0.2s;
      }
      .page-btn:hover:not(:disabled) { border-color: #fff; color: #fff; background: var(--secondary-dim); }
      .page-btn.active { background: var(--secondary); color: #000; box-shadow: 0 0 15px var(--secondary-glow); }
      .page-btn:disabled { opacity: 0.2; cursor: not-allowed; border-style: dashed; }

      /* =========================================================
         SYSTEM ALERTS
      ========================================================= */
      .empty-state, .loading, .error {
        background: rgba(5, 10, 15, 0.9); border: 1px solid var(--border); padding: 80px 20px;
        text-align: center; color: var(--secondary); grid-column: 1 / -1; text-transform: uppercase;
        clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        position: relative; animation: sysBoot 0.4s ease-out;
      }
      .empty-state::before, .loading::before, .error::before {
        content: "[ SYSTEM_DIAGNOSTICS ]"; position: absolute; top: 15px; left: 20px; font-size: 11px; color: var(--text-muted); font-weight: 900; letter-spacing: 2px;
      }
      .empty-icon { font-size: 50px; margin-bottom: 20px; color: var(--secondary); }
      .empty-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-bottom: 8px; color: #fff; }
      .empty-text { font-size: 14px; color: var(--text-muted); letter-spacing: 1.5px; }

      /* Lightweight Spinner */
      .spinner {
        width: 50px; height: 50px; border: 3px solid transparent;
        border-top-color: var(--primary); border-bottom-color: var(--secondary); border-radius: 50%;
        animation: hudSpin 0.8s linear infinite;
        margin: 0 auto 20px; box-shadow: 0 0 15px var(--primary-glow);
      }

      .error { color: var(--danger); border-color: var(--danger); }
      .error::before { content: "[ CRITICAL_FAILURE ]"; color: var(--danger); }

      /* =========================================================
         HOLOGRAPHIC MODAL OVERLAY
      ========================================================= */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
        display: none; align-items: center; justify-content: center;
        padding: 20px; z-index: 2000; backdrop-filter: blur(10px);
      }
      .modal-overlay.show { display: flex; }

      .candidate-modal {
        width: 100%; max-width: 900px; max-height: calc(100vh - 40px);
        background: var(--bg-card); border: 2px solid var(--secondary); display: flex; flex-direction: column;
        box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 20px var(--secondary-glow);
        clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
        animation: vaultDeploy 0.3s ease-out forwards;
      }

      .modal-header {
        padding: 20px 30px; border-bottom: 2px solid var(--border);
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(90deg, var(--secondary-dim), transparent);
      }
      .modal-title-section { display: flex; align-items: center; gap: 20px; }
      .modal-name { font-size: 24px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 3px; }
      .modal-position { font-size: 13px; color: var(--secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 2px; }

      .close-modal {
        width: 40px; height: 40px; background: rgba(0,0,0,0.5); color: var(--secondary); font-size: 24px;
        display: flex; align-items: center; justify-content: center; border: 2px solid var(--secondary); font-weight: 900;
        clip-path: var(--clip-angle); transition: 0.2s;
      }
      .close-modal:hover { background: var(--danger); border-color: var(--danger); color: #000; }

      .modal-body {
        padding: 30px; overflow-y: auto;
      }
      .modal-body::-webkit-scrollbar { width: 6px; }
      .modal-body::-webkit-scrollbar-track { background: #000; }
      .modal-body::-webkit-scrollbar-thumb { background: var(--secondary); }

      .details-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
      
      .detail-item {
        padding: 15px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border); border-left: 4px solid var(--secondary);
      }

      .detail-value { font-size: 15px; color: #fff; line-height: 1.5; word-break: break-word; font-weight: 900; }

      .modal-footer {
        padding: 20px 30px; border-top: 2px solid var(--border); display: flex; justify-content: flex-end; gap: 15px;
        background: rgba(0, 0, 0, 0.7);
      }

      .modal-close-btn, .modal-resume-btn, .edit-btn {
        padding: 12px 25px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; font-size: 13px;
        border: 2px solid var(--secondary); transition: 0.2s; clip-path: var(--clip-angle);
      }
      .modal-close-btn { background: transparent; color: var(--text-muted); border-color: var(--text-muted); }
      .modal-close-btn:hover { background: var(--text-muted); color: #000; }

      .modal-resume-btn { background: var(--secondary); color: #000; text-decoration: none; border-color: var(--secondary); }
      .modal-resume-btn:hover { background: transparent; color: #fff; border-color: #fff; }

      .edit-btn { background: var(--primary); color: #000; border-color: var(--primary); }
      .edit-btn:hover { background: transparent; color: #fff; border-color: #fff; }

      /* =========================================================
         SECURE DATA ENTRY (FORMS)
      ========================================================= */
      .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
      .form-group { display: flex; flex-direction: column; gap: 8px; }
      .form-group.full { grid-column: 1 / -1; }

      .form-group label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; color: var(--secondary); }
      .form-group input {
        width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-bottom: 2px solid var(--secondary);
        background: rgba(0, 0, 0, 0.8); color: #fff; font-family: inherit; font-size: 15px; font-weight: 800; outline: none; transition: 0.2s;
      }
      .form-group input:focus {
        border-color: #fff; background: var(--secondary-dim);
      }
      .required { color: var(--danger); }

      .save-candidate-btn {
        background: var(--primary); color: #000; border: 2px solid var(--primary); font-weight: 900; font-size: 14px; padding: 12px 30px;
        text-transform: uppercase; letter-spacing: 2px;
        clip-path: var(--clip-angle); transition: 0.2s;
      }
      .save-candidate-btn:hover:not(:disabled) {
        background: transparent; color: #fff; border-color: #fff; box-shadow: 0 0 20px var(--primary-glow);
      }
      .save-candidate-btn:disabled { opacity: 0.2; background: transparent; color: var(--primary); border-style: dashed; cursor: not-allowed; }

      .form-message {
        display: none; padding: 15px; border: 1px solid var(--border); border-left: 4px solid var(--secondary);
        font-size: 14px; font-weight: 900; margin-top: 20px; text-transform: uppercase; letter-spacing: 1.5px;
        background: rgba(0,0,0,0.9);
      }
      .form-message.show { display: block; }
      .form-message.error-message { border-color: var(--danger); color: var(--danger); }
      .form-message.success-message { border-color: var(--primary); color: var(--primary); }

      /* =========================================================
         RESPONSIVE
      ========================================================= */
      @media (max-width: 900px) {
        .toolbar { flex-wrap: wrap; }
        .toolbar .search-box { flex: 1 1 100%; }
        .toolbar select, .toolbar #flagFilter, .refresh-btn { flex: 1 1 calc(50% - 10px); min-width: 0; }
        .card-footer { flex-wrap: wrap; gap: 15px; }
        .application-flag-wrap { margin-left: auto; width: 100%; justify-content: space-between;}
      }
      @media (max-width: 1400px) {
        .cards-container {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 1024px) {
        .stats-bar {
          flex-wrap: wrap;
          gap: 15px;
        }

        .cards-container {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
      }
      @media (max-width: 600px) {
        .header { padding: 0 20px; height: 60px; }
        .page-title { display: none; }
        .container { height: calc(100vh - 60px); padding: 15px; }
        .stats-bar { flex-direction: column; align-items: flex-start; gap: 10px; }
        .stat-divider { display: none; }
        .toolbar { padding: 15px; }
        .search-box { min-width: 100%; }
        .toolbar select, .toolbar button { flex: 1; }
        .module-tab { flex: 1; min-width: 0; font-size: 11px; padding: 10px; }
        .cards-container {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .details-grid, .form-grid { grid-template-columns: 1fr; }
        .form-group.full { grid-column: auto; }
        .modal-header, .modal-body, .modal-footer { padding: 20px; }
        .pagination { flex-direction: column; align-items: flex-start; gap: 15px; }
      }



/* =========================================================
   PROFESSIONAL CYBER MOTION
   Visual-only layer. Core application/data structure preserved.
   Design target: restrained near-future cyberpunk / tactical UI.
   No CRT overlays, no constant card pulsing, no full-screen canvas.
========================================================= */

:root{
  --cyber-cyan:#00e5ff;
  --cyber-green:#00ff66;
  --cyber-amber:#ffb700;
  --cyber-red:#ff003c;
  --cyber-line:rgba(0,229,255,.22);
  --cyber-glow:rgba(0,229,255,.18);
  --cyber-soft:rgba(0,255,102,.08);
}

/* Slow environmental motion — intentionally almost imperceptible. */
body{
  background-image:
    radial-gradient(circle at 18% 15%,rgba(0,229,255,.035),transparent 30%),
    radial-gradient(circle at 82% 78%,rgba(0,255,102,.025),transparent 28%);
}
body::before{
  animation:cyberGridDrift 42s linear infinite !important;
  opacity:.7;
}
body::after{
  animation:cyberRadar 68s linear infinite !important;
  opacity:.55;
}
@keyframes cyberGridDrift{
  from{background-position:0 0}
  to{background-position:40px 40px}
}
@keyframes cyberRadar{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* Matrix/telemetry becomes sparse background texture, not a "Matrix" effect. */
.matrix-rain{
  opacity:.22;
  mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  -webkit-mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
}
.matrix-drop{
  animation-name:cyberTelemetryDrift !important;
  animation-duration:22s !important;
  animation-timing-function:linear !important;
  animation-iteration-count:infinite !important;
  text-shadow:0 0 4px currentColor !important;
  opacity:0 !important;
}
@keyframes cyberTelemetryDrift{
  0%{transform:translate3d(-12vw,0,0);opacity:0}
  12%{opacity:.16}
  50%{opacity:.12}
  88%{opacity:.16}
  100%{transform:translate3d(112vw,0,0);opacity:0}
}

/* Header: precise signal line instead of a bright animated border. */
.header{
  animation:cyberReveal .55s cubic-bezier(.2,.75,.2,1) both !important;
}
.header::after{
  animation:cyberSignal 8s ease-in-out infinite !important;
  height:1px !important;
  opacity:.75;
}
@keyframes cyberReveal{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:none}
}
@keyframes cyberSignal{
  0%,100%{background-position:0% 50%;opacity:.45}
  50%{background-position:100% 50%;opacity:.9}
}

/* Logo: no random flicker. A restrained hover response only. */
.logo{
  animation:none !important;
  transition:transform .25s ease,filter .25s ease;
}
.logo:hover{
  transform:translateX(2px);
  filter:brightness(1.12);
}

/* Panels enter once. No permanent "alive" animation. */
.stats-bar,
.toolbar{
  animation:cyberPanelIn .5s cubic-bezier(.2,.75,.2,1) both !important;
}
.toolbar{animation-delay:.07s !important}
@keyframes cyberPanelIn{
  from{opacity:0;transform:translateY(7px)}
  to{opacity:1;transform:none}
}
.toolbar::after,
.stats-bar::after{
  animation:cyberEdgePass 7s cubic-bezier(.4,0,.2,1) infinite !important;
  opacity:.32;
}
@keyframes cyberEdgePass{
  0%,72%{left:-65%;opacity:0}
  80%{opacity:.55}
  100%{left:120%;opacity:0}
}

/* Inputs/buttons: tactile, controlled transitions. */
.search-box input,
select,
button,
.page-btn,
.module-tab{
  transition:
    background-color .18s ease,
    border-color .18s ease,
    color .18s ease,
    box-shadow .18s ease,
    transform .18s ease !important;
}
.search-box input:focus{
  transform:none !important;
  box-shadow:
    0 0 0 1px var(--primary),
    0 0 14px rgba(0,255,102,.12),
    inset 0 0 12px rgba(0,229,255,.035) !important;
}
button:hover:not(:disabled),
.page-btn:hover:not(:disabled),
.module-tab:hover{
  transform:translateY(-1px);
}

/* Replace glossy button sweep with a tiny one-shot edge highlight. */
button::after,
.page-btn::after,
.module-tab::after,
.refresh-btn::after,
.close-modal::after,
.save-candidate-btn::after,
.edit-btn::after,
.modal-resume-btn::after,
.modal-close-btn::after{
  display:none !important;
}

/* Module tabs: clean active-state indicator. */
.module-tab{
  position:relative;
}
.module-tab::before{
  height:2px !important;
  bottom:0 !important;
  left:14px !important;
  right:14px !important;
  background:currentColor !important;
  box-shadow:0 0 8px currentColor;
  transition:transform .22s ease !important;
}
.module-tab.active::before,
.module-tab:hover::before{
  transform:scaleX(1) !important;
}

/* Candidate cards: one-time entrance + refined hover elevation. */
.candidate-card{
  animation:cyberCardIn .42s cubic-bezier(.2,.78,.2,1) both !important;
  transform:translateZ(0);
  transition:
    transform .22s cubic-bezier(.2,.75,.2,1),
    border-color .22s ease,
    box-shadow .22s ease !important;
}
@keyframes cyberCardIn{
  from{opacity:0;transform:translate3d(0,9px,0) scale(.995)}
  to{opacity:1;transform:translate3d(0,0,0) scale(1)}
}
.candidate-card:nth-child(1){animation-delay:.02s !important}
.candidate-card:nth-child(2){animation-delay:.05s !important}
.candidate-card:nth-child(3){animation-delay:.08s !important}
.candidate-card:nth-child(4){animation-delay:.11s !important}
.candidate-card:nth-child(5){animation-delay:.14s !important}
.candidate-card:nth-child(6){animation-delay:.17s !important}
.candidate-card:nth-child(7){animation-delay:.20s !important}
.candidate-card:nth-child(8){animation-delay:.23s !important}
.candidate-card:nth-child(9){animation-delay:.26s !important}
.candidate-card:nth-child(10){animation-delay:.29s !important}
.candidate-card:nth-child(n+11){animation-delay:.32s !important}

.candidate-card::before{
  opacity:0 !important;
  animation:none !important;
  transition:opacity .2s ease !important;
}
.candidate-card:hover{
  transform:translate3d(0,-4px,0) !important;
  border-color:rgba(0,229,255,.62);
  box-shadow:
    0 14px 32px rgba(0,0,0,.48),
    0 0 18px rgba(0,229,255,.07);
}
.candidate-card:hover::before{
  opacity:.55 !important;
}
.candidate-card::after{
  animation:none !important;
  opacity:0 !important;
  height:1px !important;
  background:linear-gradient(90deg,transparent,var(--cyber-cyan),transparent) !important;
  box-shadow:0 0 8px var(--cyber-cyan) !important;
}
.candidate-card:hover::after{
  animation:cyberCardScan .85s cubic-bezier(.4,0,.2,1) 1 !important;
}
@keyframes cyberCardScan{
  0%{top:-2px;opacity:0}
  12%{opacity:.8}
  88%{opacity:.8}
  100%{top:100%;opacity:0}
}

/* Card content responds, but does not "float" independently. */
.candidate-card .card-top{
  transition:transform .22s ease !important;
}
.candidate-card:hover .card-top{
  transform:translate3d(2px,0,0) !important;
}

/* Remove continuous avatar spinning/pulsing. Keep a crisp HUD ring. */
.candidate-avatar,
.modal-avatar{
  animation:none !important;
  transition:box-shadow .22s ease,filter .22s ease !important;
}
.candidate-avatar::before,
.modal-avatar::before{
  animation:none !important;
  border-style:solid !important;
  border-color:rgba(0,229,255,.42) !important;
  clip-path:polygon(0 0,30% 0,30% 1px,70% 1px,70% 0,100% 0,100% 30%,calc(100% - 1px) 30%,calc(100% - 1px) 70%,100% 70%,100% 100%,70% 100%,70% calc(100% - 1px),30% calc(100% - 1px),30% 100%,0 100%,0 70%,1px 70%,1px 30%,0 30%);
  border-radius:0 !important;
}
.candidate-avatar::after,
.modal-avatar::after{
  animation:none !important;
  opacity:.45 !important;
}
.candidate-card:hover .candidate-avatar{
  filter:drop-shadow(0 0 7px rgba(0,229,255,.16));
}

/* Status badges: static with a tiny hover response, no perpetual shine. */
.resume-badge::after,
.interview-status-badge::after,
.no-resume::after{
  display:none !important;
}
.resume-badge,
.interview-status-badge,
.no-resume{
  transition:box-shadow .2s ease,transform .2s ease !important;
}
.resume-badge:hover,
.interview-status-badge:hover,
.no-resume:hover{
  transform:translateY(-1px);
}

/* Low-experience cards should communicate risk, not pulse like an alarm. */
.candidate-card.low-experience{
  animation:cyberCardIn .42s cubic-bezier(.2,.78,.2,1) both !important;
  background:linear-gradient(135deg,rgba(255,0,60,.045),rgba(8,16,24,.95) 48%) !important;
}
.candidate-card.low-experience .candidate-avatar{
  animation:none !important;
  filter:drop-shadow(0 0 4px rgba(255,0,60,.16));
}
.candidate-card.low-experience:hover{
  box-shadow:
    0 14px 32px rgba(0,0,0,.48),
    0 0 18px rgba(255,0,60,.10) !important;
}

/* Pagination: active state is steady, not breathing. */
.page-btn.active{
  animation:none !important;
  box-shadow:0 0 13px var(--secondary-glow) !important;
}
.page-btn.active:hover{
  box-shadow:0 0 18px var(--secondary-glow) !important;
}

/* Loading/diagnostic state: single restrained scan. */
.empty-state,
.loading,
.error{
  animation:cyberPanelIn .35s ease both !important;
}
.empty-state::after,
.loading::after,
.error::after{
  animation:cyberDiagnosticScan 2.6s ease-in-out infinite !important;
  height:1px !important;
  opacity:.35 !important;
}
@keyframes cyberDiagnosticScan{
  0%,15%{top:0;opacity:0}
  30%{opacity:.55}
  70%{opacity:.55}
  100%{top:100%;opacity:0}
}

/* Spinner: clean dual arc, no excessive glow. */
.spinner{
  animation:cyberSpin .9s linear infinite !important;
  box-shadow:0 0 8px rgba(0,229,255,.10) !important;
}
.spinner::after{
  animation:cyberSpinReverse 1.8s linear infinite !important;
  opacity:.45 !important;
}
@keyframes cyberSpin{to{transform:rotate(360deg)}}
@keyframes cyberSpinReverse{to{transform:rotate(-360deg)}}

/* Modal: cinematic but restrained. */
.modal-overlay{
  backdrop-filter:blur(6px) !important;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,229,255,.035),transparent 42%),
    rgba(0,0,0,.86) !important;
}
.modal-overlay::before{
  animation:cyberModalScan 3.8s ease-in-out infinite !important;
  opacity:.35 !important;
}
@keyframes cyberModalScan{
  0%,12%{top:-4%;opacity:0}
  25%{opacity:.45}
  75%{opacity:.45}
  100%{top:104%;opacity:0}
}
.candidate-modal{
  animation:cyberModalIn .28s cubic-bezier(.2,.8,.2,1) both !important;
  box-shadow:
    0 24px 60px rgba(0,0,0,.62),
    0 0 24px rgba(0,229,255,.10) !important;
}
@keyframes cyberModalIn{
  from{opacity:0;transform:translateY(8px) scale(.985)}
  to{opacity:1;transform:none}
}
.candidate-modal::before{
  animation:none !important;
  opacity:.14 !important;
}
.detail-item{
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease !important;
}
.detail-item:hover{
  transform:translate3d(2px,0,0) !important;
}

/* Form focus is a signal, not a glow explosion. */
.form-group::after{
  transition:width .24s ease !important;
  box-shadow:0 0 5px var(--primary) !important;
}
.form-group input:focus{
  box-shadow:inset 0 0 10px rgba(0,229,255,.035) !important;
}

/* Keep mobile clean. */
@media (max-width:700px){
  body::before{animation-duration:55s !important}
  body::after{animation-duration:90s !important}
  .matrix-rain{opacity:.12}
  .candidate-card:hover{transform:none !important}
  .candidate-card:hover .card-top{transform:none !important}
  .candidate-card{backdrop-filter:none !important}
}

.cyber-click{animation:cyberClick .18s ease-out !important}
@keyframes cyberClick{
  0%{filter:brightness(1)}
  45%{filter:brightness(1.18)}
  100%{filter:brightness(1)}
}

/* Accessibility: fully respect reduced motion. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.001ms !important;
  }
}



/* Keep the search field + all filters + Refresh on one toolbar row
   whenever the available width permits. The toolbar itself may still
   wrap on genuinely narrow screens. */
.toolbar{
  display:flex !important;
  flex-wrap:nowrap !important;
  align-items:center !important;
  gap:12px !important;
}

.toolbar .search-box{
  flex:1 1 auto !important;
  min-width:220px !important;
}

.toolbar select{
  flex:0 0 auto !important;
  width:auto !important;
  min-width:150px !important;
}

.toolbar #flagFilter{
  flex:0 0 135px !important;
  width:135px !important;
  min-width:135px !important;
}

.toolbar .refresh-btn{
  flex:0 0 auto !important;
  width:auto !important;
  min-width:120px !important;
  white-space:nowrap !important;
}

/* On smaller screens, allow the toolbar to wrap naturally. */
@media (max-width:1100px){
  .toolbar{
    flex-wrap:wrap !important;
  }

  .toolbar .search-box{
    flex:1 1 100% !important;
    min-width:100% !important;
  }

  .toolbar select,
  .toolbar #flagFilter,
  .toolbar .refresh-btn{
    flex:1 1 calc(25% - 9px) !important;
    min-width:0 !important;
    width:auto !important;
  }
}

@media (max-width:600px){
  .toolbar{
    flex-wrap:wrap !important;
  }

  .toolbar .search-box{
    flex:1 1 100% !important;
    min-width:100% !important;
  }

  .toolbar select,
  .toolbar #flagFilter,
  .toolbar .refresh-btn{
    flex:1 1 calc(50% - 6px) !important;
  }
}



/* =========================================================
   REFRESH BUTTON VISIBILITY FIX
   Keeps Refresh inside the Applications toolbar at all
   desktop widths while preserving the existing HTML, JS,
   data flow, animations and overall layout.
   ========================================================= */

/* Desktop: give the search box the flexible space and let
   filters compress before the Refresh button does. */
.toolbar{
  width:100% !important;
  max-width:100% !important;
  min-width:0 !important;
  overflow:visible !important;
  flex-wrap:nowrap !important;
}

.toolbar .search-box{
  flex:1 1 0 !important;
  width:auto !important;
  min-width:0 !important;
}

.toolbar select{
  flex:0 1 165px !important;
  width:165px !important;
  min-width:105px !important;
  max-width:165px !important;
}

.toolbar #flagFilter{
  flex:0 1 135px !important;
  width:135px !important;
  min-width:105px !important;

/* =========================================================
   TRACKERS MODULE
========================================================= */
.trackers-workspace {
  display: none;
  padding: 18px 0 30px;
  animation: sysBoot .25s ease both;
}

.trackers-mode .stats-bar,
.trackers-mode .toolbar,
.trackers-mode .applications-scroll {
  display: none !important;
}

.trackers-mode .trackers-workspace {
  display: block;
}

.trackers-panel {
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(5,12,18,.94), rgba(4,10,15,.88));
  box-shadow: 0 0 22px rgba(0,229,255,.08), inset 0 0 30px rgba(0,255,102,.025);
  padding: 18px;
  position: relative;
  overflow: hidden;
}

.trackers-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,229,255,.018) 4px);
}

.trackers-toolbar {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.tracker-format-group {
  flex: 1 1 300px;
  min-width: 240px;
}

.tracker-format-group label,
.tracker-option-label {
  display: block;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.tracker-format-select {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--border);
  background: rgba(2,8,12,.9);
  color: var(--text-main);
  padding: 10px 12px;
  outline: none;
  font: inherit;
}

.tracker-format-select:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 12px var(--secondary-dim);
}

.tracker-action-btn {
  min-height: 42px;
  border: 1px solid var(--border);
  background: rgba(0,229,255,.06);
  color: var(--text-bright);
  padding: 10px 14px;
  cursor: pointer;
  font: inherit;
  font-weight: 700;
  letter-spacing: .5px;
  transition: .2s ease;
}

.tracker-action-btn:hover:not(:disabled) {
  border-color: var(--secondary);
  box-shadow: 0 0 15px var(--secondary-dim);
  transform: translateY(-1px);
}

.tracker-action-btn.primary {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-dim);
}

.tracker-action-btn.danger {
  border-color: var(--danger);
  color: #ff9ab1;
  background: var(--danger-dim);
}

.tracker-action-btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.tracker-options {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 0 0 auto;
  min-height: 42px;
}

.tracker-check {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--text-main);
  font-size: 12px;
  white-space: nowrap;
}

.tracker-check input { accent-color: var(--primary); }

.tracker-meta {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--text-muted);
  font-size: 11px;
  letter-spacing: .7px;
  margin-bottom: 12px;
}

.tracker-status-ok { color: var(--primary); }
.tracker-status-error { color: #ff8da6; }

.tracker-rows {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tracker-row {
  border: 1px solid rgba(0,229,255,.2);
  background: rgba(3,9,14,.8);
  padding: 14px;
  position: relative;
}

.tracker-row-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.tracker-row-number {
  color: var(--secondary);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.tracker-remove-row {
  border: 1px solid rgba(255,0,60,.35);
  color: #ff7f9b;
  background: rgba(255,0,60,.06);
  padding: 5px 9px;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
}

.tracker-fields {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.tracker-field {
  min-width: 0;
}

.tracker-field label {
  display: block;
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: .6px;
  margin-bottom: 5px;
  overflow-wrap: anywhere;
}

.tracker-field input,
.tracker-field textarea {
  width: 100%;
  border: 1px solid rgba(0,229,255,.18);
  background: rgba(1,5,8,.9);
  color: var(--text-main);
  padding: 9px 10px;
  min-height: 38px;
  outline: none;
  font: inherit;
  font-size: 12px;
  resize: vertical;
}

.tracker-field textarea { min-height: 70px; }

.tracker-field input:focus,
.tracker-field textarea:focus {
  border-color: var(--secondary);
  box-shadow: 0 0 9px var(--secondary-dim);
}

.tracker-empty {
  position: relative;
  z-index: 1;
  padding: 48px 18px;
  text-align: center;
  border: 1px dashed rgba(0,229,255,.2);
  color: var(--text-muted);
}

.tracker-empty strong {
  display: block;
  color: var(--secondary);
  margin-bottom: 7px;
  font-size: 14px;
}

.tracker-preview-wrap {
  position: relative;
  z-index: 1;
  margin-top: 16px;
  border-top: 1px solid rgba(0,229,255,.16);
  padding-top: 14px;
}

.tracker-preview-title {
  color: var(--text-muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.tracker-preview {
  width: 100%;
  min-height: 110px;
  max-height: 260px;
  overflow: auto;
  white-space: pre;
  tab-size: 4;
  background: #020608;
  border: 1px solid rgba(0,229,255,.14);
  color: #b9ffe0;
  padding: 12px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 11px;
  line-height: 1.5;
}

@media (max-width: 1024px) {
  .tracker-fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 600px) {
  .trackers-panel { padding: 12px; }
  .tracker-fields { grid-template-columns: 1fr; }
  .tracker-toolbar { align-items: stretch; }
  .tracker-action-btn, .tracker-options { width: 100%; }
}

function getSourcedFlag(candidate) {
        const value = getField(candidate, "FLAG", "flag");
        const v = String(value || "").trim().toLowerCase();
        if (v === "original") return "Original";
        if (v === "duplicate") return "Duplicate";
        return "";
      }

function getSourcedProcessStatus(candidate) {
        const value = getField(candidate, "PROCESS STATUS", "process status", "processStatus");
        const v = String(value || "").trim().toLowerCase();
        if (v === "processed") return "Processed";
        if (v === "not processed" || v === "notprocessed") return "Not Processed";
        return "";
      }

function getProcessedFlag(candidate) {
        return getSourcedFlag(candidate);
      }

function getInterviewStatus(candidate) {
        const value = getField(candidate, "INTERVIEW STATUS", "interview status", "interviewStatus");
        const v = String(value || "").trim().toLowerCase();
        if (v === "interview scheduled") return "Interview Scheduled";
        if (v === "interview not scheduled" || v === "not scheduled") return "Interview Not Scheduled";
        return "";
      }

function applyStageSelectClass(selectElement) {
        if (!selectElement) return;
        selectElement.classList.remove("flag-original","flag-duplicate","status-processed","status-not-processed","status-scheduled","status-not-scheduled");
        if (selectElement.dataset.field === "FLAG") {
          if (selectElement.value === "Original") selectElement.classList.add("flag-original");
          if (selectElement.value === "Duplicate") selectElement.classList.add("flag-duplicate");
        } else if (selectElement.dataset.field === "PROCESS STATUS") {
          if (selectElement.value === "Processed") selectElement.classList.add("status-processed");
          if (selectElement.value === "Not Processed") selectElement.classList.add("status-not-processed");
        } else if (selectElement.dataset.field === "INTERVIEW STATUS") {
          if (selectElement.value === "Interview Scheduled") selectElement.classList.add("status-scheduled");
          if (selectElement.value === "Interview Not Scheduled") selectElement.classList.add("status-not-scheduled");
        }
      }

async function updateStageFlag(candidate, field, value, selectElement) {
        const isSourced = activeModule === "sourced";
        const allowed = field === "FLAG"
          ? ["", "Original", "Duplicate"]
          : isSourced
            ? ["", "Processed", "Not Processed"]
            : ["", "Interview Scheduled", "Interview Not Scheduled"];
        if (!allowed.includes(value)) throw new Error("Invalid dropdown value.");
        if (selectElement) selectElement.classList.add("saving");
        try {
          const payload = { __sheetRow: Number(candidate.__sheetRow) };
          payload[field] = value;
          const response = await fetch(isSourced ? SOURCED_API_URL : PROCESSED_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
            body: new URLSearchParams({ action: isSourced ? "updateSourcedFlags" : "updateProcessedFlags", data: JSON.stringify(payload) })
          });
          const result = await response.json();
          if (!result.success) throw new Error(result.error || "Unable to update status.");
          candidate[field] = result[field] || value || "";
          if (selectElement) { selectElement.value = candidate[field]; applyStageSelectClass(selectElement); }
          updateStatistics();
          return true;
        } finally {
          if (selectElement) selectElement.classList.remove("saving");
        }
      }

function parseExperience(value) {
        const match = String(value ?? "")
          .replace(/,/g, ".")
          .match(/(\d+(?:\.\d+)?)/);

        if (!match) {
          return NaN;
        }

        return parseFloat(match[1]);
      }

function formatDate(value) {
        if (!value) {
          return "—";
        }

        const text = String(value).trim();

        if (!text) {
          return "—";
        }

        const ddmmyyyy = text.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);

        if (ddmmyyyy) {
          let year = parseInt(ddmmyyyy[3], 10);

          if (year < 100) {
            year += 2000;
          }

          return (
            String(ddmmyyyy[1]).padStart(2, "0") +
            "/" +
            String(ddmmyyyy[2]).padStart(2, "0") +
            "/" +
            year
          );
        }

        const date = new Date(text);

        if (!Number.isNaN(date.getTime())) {
          return (
            String(date.getDate()).padStart(2, "0") +
            "/" +
            String(date.getMonth() + 1).padStart(2, "0") +
            "/" +
            date.getFullYear()
          );
        }

        return text;
      }

function formatTimestamp(value) {
        if (!value) {
          return "—";
        }

        const text = String(value).trim();

        if (!text) {
          return "—";
        }

        const date = new Date(text);

        if (!Number.isNaN(date.getTime())) {
          return (
            String(date.getDate()).padStart(2, "0") +
            "/" +
            String(date.getMonth() + 1).padStart(2, "0") +
            "/" +
            date.getFullYear() +
            " " +
            String(date.getHours()).padStart(2, "0") +
            ":" +
            String(date.getMinutes()).padStart(2, "0")
          );
        }

        return text;
      }

function getRecordSortTime(record) {
        let dateValue = "";

        if (activeModule === "applications") {
          dateValue = getField(record, "Timestamp");
        } else if (activeModule === "sourced" || activeModule === "processed") {
          dateValue = getField(record, "date");
        } else {
          dateValue = getField(record, "date");
        }

        if (!dateValue) {
          return 0;
        }

        const value = String(dateValue).trim();

        const ddmmyyyy = value.match(
          /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:\s+(.*))?$/,
        );

        if (ddmmyyyy) {
          const day = parseInt(ddmmyyyy[1], 10);

          const month = parseInt(ddmmyyyy[2], 10) - 1;

          let year = parseInt(ddmmyyyy[3], 10);

          if (year < 100) {
            year += 2000;
          }

          let hours = 0;
          let minutes = 0;
          let seconds = 0;

          if (ddmmyyyy[4]) {
            const timeMatch = ddmmyyyy[4].match(
              /(\d{1,2}):(\d{2})(?::(\d{2}))?/,
            );

            if (timeMatch) {
              hours = parseInt(timeMatch[1], 10);

              minutes = parseInt(timeMatch[2], 10);

              seconds = parseInt(timeMatch[3] || "0", 10);
            }
          }

          const parsed = new Date(
            year,
            month,
            day,
            hours,
            minutes,
            seconds,
          ).getTime();

          return Number.isNaN(parsed) ? 0 : parsed;
        }

        const parsed = Date.parse(value);

        return Number.isNaN(parsed) ? 0 : parsed;
      }

      /* =========================================================
        ACTIVE DATA
    ========================================================== */

function escapeHTML(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

function getInitials(name) {
        const words = String(name || "")
          .trim()
          .split(/\s+/)
          .filter(Boolean);

        if (!words.length) {
          return "?";
        }

        if (words.length === 1) {
          return words[0].substring(0, 2).toUpperCase();
        }

        return (words[0][0] + words[words.length - 1][0]).toUpperCase();
      }

function normalizeHeader(value) {
        return String(value ?? "")
          .trim()
          .toLowerCase()
          .replace(/\s+/g, " ");
      }

function getField(object, ...names) {
        if (!object) {
          return "";
        }

        for (const name of names) {
          if (Object.prototype.hasOwnProperty.call(object, name)) {
            return object[name];
          }

          const target = normalizeHeader(name);

          const key = Object.keys(object).find(
            (k) => normalizeHeader(k) === target,
          );

          if (key !== undefined) {
            return object[key];
          }
        }

        return "";
      }

function getActiveAllData() {
        if (activeModule === "applications") {
          return allApplications;
        } else if (activeModule === "sourced") {
          return allSourced;
        } else if (activeModule === "processed") {
          return allProcessed;
        }

        return allInterviews;
      }

function getActiveData() {
        if (activeModule === "applications") {
          return filteredApplications;
        } else if (activeModule === "sourced") {
          return filteredSourced;
        } else if (activeModule === "processed") {
          return filteredProcessed;
        }

        return filteredInterviews;
      }

      /* =========================================================
        FILTER OPTIONS
    ========================================================== */

function populateFilters() {
        const data = getActiveAllData();

        const currentLocation = locationFilter.value;

        const currentPosition = positionFilter.value;

        const locations = [
          ...new Set(
            data
              .map((item) => {
                if (activeModule === "applications") {
                  return String(getField(item, "Location") || "").trim();
                }

                if (
                  activeModule === "sourced" ||
                  activeModule === "processed"
                ) {
                  return String(
                    getField(item, "current location", "Current Location") ||
                      "",
                  ).trim();
                }

                return "";
              })
              .filter(Boolean),
          ),
        ].sort((a, b) =>
          a.localeCompare(b, undefined, {
            sensitivity: "base",
          }),
        );

        const positions = [
          ...new Set(
            data
              .map((item) => {
                if (activeModule === "applications") {
                  return String(
                    getField(item, "Position applied for") || "",
                  ).trim();
                }

                if (
                  activeModule === "sourced" ||
                  activeModule === "processed"
                ) {
                  return String(getField(item, "Role") || "").trim();
                }

                return String(getField(item, "role", "Role") || "").trim();
              })
              .filter(Boolean),
          ),
        ].sort((a, b) =>
          a.localeCompare(b, undefined, {

          }),
        );

        locationFilter.innerHTML =
          '<option value="">All Locations</option>' +
          locations
            .map(
              (value) =>
                `<option value="${escapeHTML(value)}">${escapeHTML(value)}</option>`,
            )
            .join("");

        positionFilter.innerHTML =
          (activeModule === "interviews"
            ? '<option value="">All Roles</option>'
            : '<option value="">All Positions</option>') +
          positions
            .map(
              (value) =>
                `<option value="${escapeHTML(value)}">${escapeHTML(value)}</option>`,
            )
            .join("");

        if (locations.includes(currentLocation)) {
          locationFilter.value = currentLocation;
        }

        if (positions.includes(currentPosition)) {
          positionFilter.value = currentPosition;
        }
      }

      /* =========================================================
        APPLY FILTERS + SORT
    ========================================================== */

function applyFilters() {
        const search = searchInput.value.trim().toLowerCase();

        const location = locationFilter.value.trim().toLowerCase();

        const position = positionFilter.value.trim().toLowerCase();

        const experience = experienceFilter.value;

        const selectedFlag =
          activeModule === "applications"
            ? flagFilter.value.trim().toLowerCase()
            : "";

        const source = getActiveAllData();

        const filtered = source.filter((candidate) => {
          let matchesSearch = true;

          let matchesLocation = true;

          let matchesPosition = true;

          let matchesExperience = true;

          let matchesFlag = true;

          if (search) {
            const values = Object.values(candidate).map((value) =>
              String(value ?? "").toLowerCase(),
            );

            matchesSearch = values.some((value) => value.includes(search));
          }

          if (activeModule !== "interviews") {
            const candidateLocation = String(
              getField(
                candidate,
                activeModule === "applications"
                  ? "Location"
                  : "current location",
                "Current Location",
              ) || "",
            )
              .trim()
              .toLowerCase();

            matchesLocation = !location || candidateLocation === location;
          }

          const candidatePosition = String(
            getField(
              candidate,
              activeModule === "applications" ? "Position applied for" : "Role",
              "role",
            ) || "",
          )
            .trim()
            .toLowerCase();

          matchesPosition = !position || candidatePosition === position;

          if (activeModule !== "interviews" && experience) {
            const exp = parseExperience(
              getField(
                candidate,
                activeModule === "applications"
                  ? "Years of experience"
                  : "total experience",
                "Years of experience",
              ),
            );

            if (Number.isNaN(exp)) {
              matchesExperience = false;
            } else if (experience === "0-2") {
              matchesExperience = exp >= 0 && exp <= 2;
            } else if (experience === "2-5") {
              matchesExperience = exp > 2 && exp <= 5;
            } else if (experience === "5-8") {
              matchesExperience = exp > 5 && exp <= 8;
            } else if (experience === "8+") {
              matchesExperience = exp > 8;
            }
          }

          if (activeModule === "applications" && selectedFlag) {
            const candidateFlag = getApplicationFlag(candidate)
              .trim()
              .toLowerCase();

            matchesFlag = candidateFlag === selectedFlag;
          }

          return (
            matchesSearch &&
            matchesLocation &&
            matchesPosition &&
            matchesExperience &&
            matchesFlag
          );
        });

        if (activeModule === "sourced" || activeModule === "processed") {
          filtered.sort((a, b) => {
            const rowA = Number(a.__sheetRow);

            const rowB = Number(b.__sheetRow);

            const validA = Number.isFinite(rowA);

            const validB = Number.isFinite(rowB);

            if (validA && validB) {
              return rowB - rowA;
            }

            if (validB) {
              return 1;
            }

            if (validA) {
              return -1;
            }

            return 0;
          });
        } else {
          filtered.sort((a, b) => getRecordSortTime(b) - getRecordSortTime(a));
        }

        if (activeModule === "applications") {
          filteredApplications = filtered;
        } else if (activeModule === "sourced") {
          filteredSourced = filtered;
        } else if (activeModule === "processed") {
          filteredProcessed = filtered;
        } else {
          filteredInterviews = filtered;
        }

        currentPage = 1;

        updateStatistics();

        renderCards();
      }

function renderCards() {
        loading.style.display = "none";

        error.style.display = "none";

        const data = getActiveData();

        cardsContainer.innerHTML = "".trim();

        if (!data.length) {
          cardsContainer.innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">

        `;

          cardsContainer.style.display = "grid";

          return;
        }

        const totalPages = Math.ceil(data.length / rowsPerPage);

        if (currentPage > totalPages) {
          currentPage = totalPages;
        }

        const start = (currentPage - 1) * rowsPerPage;

        const end = Math.min(start + rowsPerPage, data.length);

        const pageData = data.slice(start, end);

        pageData.forEach((candidate) => renderCard(candidate));

        cardsContainer.style.display = "grid";

        renderPagination(data.length, start, end, totalPages);

function renderCard(candidate) {
  const card = document.createElement("div");
  card.className = "candidate-card";
  renderSourcedCard(card, candidate);
  card.addEventListener("click", () => openCandidateModal(candidate));

  const stageSelects = card.querySelectorAll(".stage-flag-select");
  stageSelects.forEach((selectElement) => {
    selectElement.addEventListener("click", (event) => event.stopPropagation());
    selectElement.addEventListener("change", async (event) => {
      event.stopPropagation();
      const field = event.target.dataset.field;
      const value = event.target.value;
      const previous = getField(candidate, field);
      try {
        await updateStageFlag(candidate, field, value, selectElement);
      } catch (err) {
        event.target.value = previous || "";
        applyStageSelectClass(event.target);
        alert(err.message || "Unable to update candidate status.");
      }
    });
    applyStageSelectClass(selectElement);
  });
  cardsContainer.appendChild(card);
}
function renderPagination(total, start, end, totalPages) {
        if (totalPages <= 1) {
          paginationContainer.style.display = "none";

          return;
        }

        paginationContainer.style.display = "flex";

        paginationInfo.textContent = `Showing ${start + 1}-${end} of ${total}`;

        paginationButtons.innerHTML = "";

        const previous = document.createElement("button");

        previous.className = "page-btn";

        previous.textContent = "<";

        previous.disabled = currentPage === 1;

        previous.addEventListener("click", () => {
          if (currentPage > 1) {
            currentPage--;

            renderCards();

            document.querySelector(".applications-scroll").scrollTo({
              top: 0,
              behavior: "smooth",
            });
          }
        });

        paginationButtons.appendChild(previous);

        const maxVisiblePages = 7;

        let startPage = Math.max(
          1,
          currentPage - Math.floor(maxVisiblePages / 2),
        );

        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage + 1 < maxVisiblePages) {
          startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
          const button = document.createElement("button");

          button.className = "page-btn" + (i === currentPage ? " active" : "");

          button.textContent = i;

          button.addEventListener("click", () => {
            currentPage = i;

            renderCards();

            document.querySelector(".applications-scroll").scrollTo({
              top: 0,
              behavior: "smooth",
            });
          });

          paginationButtons.appendChild(button);
        }

        const next = document.createElement("button");

        next.className = "page-btn";

        next.textContent = ">";

        next.disabled = currentPage === totalPages;

        next.addEventListener("click", () => {
          if (currentPage < totalPages) {
            currentPage++;

            renderCards();

            document.querySelector(".applications-scroll").scrollTo({
              top: 0,
              behavior: "smooth",
            });
          }
        });

        paginationButtons.appendChild(next);
      }

          if (!result.success) {

async function saveSourcedCandidate(event) {
